<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reposys Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --primary-blue: #0047ab;
        --primary-gradient: linear-gradient(135deg, #0047ab 0%, #1e40af 100%);
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --panel: #f8fafc;
        --success: #10b981;
        --warning: #f59e0b;
        --info: #3b82f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at 0% 0%, rgba(30, 64, 175, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.05) 0%, transparent 40%),
                    #f8fafe;
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 460px);
        text-align: center;
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .card {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 32px;
        padding: 40px 32px;
        box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.08),
                    0 0 1px 1px rgba(0, 0, 0, 0.02);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .brand {
        font-family: 'Outfit', sans-serif;
        margin: 0 0 8px;
        color: var(--primary-blue);
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }

      .illustration-container {
        margin: 24px auto;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .pulse-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(0, 71, 171, 0.06);
        animation: pulse 2s infinite ease-in-out;
      }

      .offline-icon {
        color: var(--primary-blue);
        filter: drop-shadow(0 8px 16px rgba(0, 71, 171, 0.15));
        animation: float 3s ease-in-out infinite;
        z-index: 1;
      }

      h1 {
        font-family: 'Outfit', sans-serif;
        margin: 0 0 12px;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text-main);
      }

      .description {
        margin: 0 0 28px;
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        padding: 0 12px;
      }

      .status-panel {
        margin: 0 0 32px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: #ffffff;
        text-align: left;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01);
      }

      .status-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-title::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: var(--warning);
        border-radius: 50%;
      }

      .order-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .order-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .order-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .order-value {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-main);
      }

      .badge {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .badge-in-queue {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .badge-processing {
        background: #fffbeb;
        color: #b45309;
      }

      .badge-ready {
        background: #ecfdf5;
        color: #047857;
      }

      .badge-completed {
        background: #f1f5f9;
        color: #475569;
      }

      .empty-status {
        font-size: 0.9rem;
        color: var(--text-muted);
        text-align: center;
        padding: 8px 0;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 16px 24px;
        background: var(--primary-gradient);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        box-shadow: 0 10px 25px -5px rgba(0, 71, 171, 0.3);
        transition: all 0.2s ease-in-out;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px -4px rgba(0, 71, 171, 0.4);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: 0 6px 15px -4px rgba(0, 71, 171, 0.3);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(0.92);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 24px;
          border-radius: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="brand">Reposys</p>
        
        <div class="illustration-container">
          <div class="pulse-ring"></div>
          <svg class="offline-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Offline Wi-Fi Icon -->
            <path d="M1 1l22 22"></path>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
            <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"></path>
            <path d="M12 18a2 2 0 1 1-2-2"></path>
            <path d="M16.07 7.93A15 15 0 0 1 23 10"></path>
            <path d="M1 10a14.88 14.88 0 0 1 10.15-4.14"></path>
          </svg>
        </div>

        <h1>Connection Lost</h1>
        <p class="description">
          You are currently offline. Reposys will automatically reconnect once your internet service is restored.
        </p>
        
        <div class="status-panel">
          <div class="status-title">Last Known Active Order</div>
          <div id="order-container">
            <div class="empty-status">Checking cache for recent orders...</div>
          </div>
        </div>

        <button type="button" onclick="window.location.reload()">Retry Connection</button>
      </div>
    </main>

    <script>
      // Load last known orders from localStorage
      function loadCachedOrder() {
        const container = document.getElementById('order-container');
        try {
          const cachedStr = localStorage.getItem('reposys_last_orders');
          if (cachedStr) {
            const orders = JSON.parse(cachedStr);
            if (Array.isArray(orders) && orders.length > 0) {
              // Find the first active order, otherwise fallback to the most recent one
              const activeStatuses = ['In_Queue', 'Processing', 'ReadyForPickup'];
              const activeOrder = orders.find(o => activeStatuses.includes(o.status)) || orders[0];
              
              let badgeClass = 'badge-completed';
              let friendlyStatus = activeOrder.status.replace(/_/g, ' ');
              
              if (activeOrder.status === 'In_Queue') {
                badgeClass = 'badge-in-queue';
              } else if (activeOrder.status === 'Processing') {
                badgeClass = 'badge-processing';
              } else if (activeOrder.status === 'ReadyForPickup') {
                badgeClass = 'badge-ready';
                friendlyStatus = 'Ready';
              }

              container.innerHTML = `
                <div class="order-info">
                  <div class="order-row">
                    <span class="order-label">Token Number</span>
                    <span class="order-value" style="font-family: monospace; font-size: 1.1rem; letter-spacing: 0.05em;">${activeOrder.tokenNumber || '---'}</span>
                  </div>
                  <div class="order-row" style="margin-top: 4px;">
                    <span class="order-label">Service</span>
                    <span class="order-value">${activeOrder.serviceType || '---'}</span>
                  </div>
                  <div class="order-row" style="margin-top: 12px; border-t: 1px solid var(--border); padding-top: 8px;">
                    <span class="order-label">Status</span>
                    <span class="badge ${badgeClass}">${friendlyStatus}</span>
                  </div>
                </div>
              `;
              return;
            }
          }
        } catch (e) {
          console.error('Failed to parse cached orders', e);
        }
        
        // Fallback when no cache exists
        container.innerHTML = '<div class="empty-status">No cached orders found on this device.</div>';
      }

      // Initialize
      loadCachedOrder();

      // Auto reconnect check
      setInterval(() => {
        fetch('/manifest.json')
          .then(() => window.location.reload())
          .catch(() => {});
      }, 5000);
    </script>
  </body>
</html>
