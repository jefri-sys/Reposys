<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Diagnostics</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; margin: 0; padding: 24px; color: #1e293b; }
    h2 { margin-top: 0; margin-bottom: 24px; font-size: 18px; }
    .diag-list { display: flex; flex-direction: column; gap: 12px; }
    .diag-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 16px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .indicator.green { background-color: #10b981; }
    .indicator.red { background-color: #ef4444; }
    .indicator.gray { background-color: #94a3b8; }
    .label { display: flex; align-items: center; font-size: 14px; font-weight: 500; }
    .val { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <h2>Diagnostics</h2>
  <div class="diag-list" id="diagList">
    <!-- populating via JS -->
  </div>
  
  <script>
    async function load() {
      const diag = await window.api.getDiagnostics();
      const list = document.getElementById('diagList');
      
      const items = [
        { key: 'backendReachable', label: 'Backend Reachable' },
        { key: 'socketConnected', label: 'Socket.IO Connected' },
        { key: 'printerDetected', label: 'Printers Detected' },
        { key: 'sumatraPdfFound', label: 'SumatraPDF Found' },
        { key: 'heartbeatActive', label: 'Heartbeat Active' }
      ];
      
      let html = '';
      items.forEach(item => {
        const isOk = diag[item.key];
        const color = isOk ? 'green' : 'red';
        const text = isOk ? 'OK' : 'FAIL';
        html += `
          <div class="diag-item">
            <div class="label"><span class="indicator ${color}"></span> ${item.label}</div>
            <div class="val">${text}</div>
          </div>
        `;
      });
      
      html += `
        <div class="diag-item">
          <div class="label"><span class="indicator gray"></span> Last Print At</div>
          <div class="val">${diag.lastPrintAt ? new Date(diag.lastPrintAt).toLocaleString() : 'Never'}</div>
        </div>
        <div class="diag-item">
          <div class="label"><span class="indicator gray"></span> Agent Version</div>
          <div class="val">${diag.agentVersion}</div>
        </div>
      `;
      
      list.innerHTML = html;
    }
    
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
